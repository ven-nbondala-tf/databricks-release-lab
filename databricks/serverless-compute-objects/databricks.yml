bundle:
  name: serverless-compute-objects

variables:
  compute_id:
    description: Id of the serverless compute object the job runs on. In the UI, open the Serverless tab of Compute and use the Actions menu to copy it. The default is Default Automated Compute.
    default: 66c36de7-c991-3857-8248-d289a92730c1
  owner_group:
    description: Workspace group that can manage the resources
    default: admins

resources:
  jobs:
    serverless_objects_demo:
      name: serverless_objects_demo
      max_concurrent_runs: 1
      parameters:
        - name: rows
          default: "300000000"
        - name: partitions
          default: "1200"
      job_clusters:
        - job_cluster_key: serverless_object
          serverless_compute:
            policy_id: ${var.compute_id}
      tasks:
        - task_key: workload
          job_cluster_key: serverless_object
          notebook_task:
            notebook_path: ./src/workload.py
            base_parameters:
              rows: "{{job.parameters.rows}}"
              partitions: "{{job.parameters.partitions}}"

targets:
  prod:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Deployments/${bundle.name}/${bundle.target}
    permissions:
      - group_name: ${var.owner_group}
        level: CAN_MANAGE
