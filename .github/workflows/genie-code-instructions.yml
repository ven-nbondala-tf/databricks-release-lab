name: genie-code-instructions

# Started by hand from the Actions tab (Run workflow). Pick the environment and
# only that environment is deployed, using instructions/<environment>.md.
# DEV and TEST can run from any branch, which is useful before a merge.
# PROD can only run from main, and it waits for approval from the required
# reviewers set on the "prod" GitHub environment.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - test
          - prod

permissions:
  contents: read

# One deployment at a time, so an older run cannot overwrite a newer one.
concurrency:
  group: genie-code-instructions-deploy
  cancel-in-progress: false

env:
  FEATURE_DIR: databricks/genie-code-instructions
  CLI_VERSION: 1.24.0

# The setup-cli action is pinned to the commit of its v1.24.0 tag, and the
# access token is only passed to the deploy step, so the setup action never
# sees it.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check instruction file length
        run: python "$FEATURE_DIR/scripts/check_length.py"

  deploy:
    needs: check
    # PROD only deploys from main. DEV and TEST can run from any branch.
    if: inputs.environment != 'prod' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The environment holds the secrets. Required reviewers on "prod" hold the
    # job here until someone approves.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@483500c487a296b26b5875a07decbd6e7b1b58c5 # v1.24.0
        with:
          version: ${{ env.CLI_VERSION }}
      - name: Deploy ${{ inputs.environment }}.md to ${{ inputs.environment }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          DATABRICKS_AUTH_TYPE: pat
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: bash "$FEATURE_DIR/scripts/deploy.sh" "$FEATURE_DIR/instructions/${ENVIRONMENT}.md"
