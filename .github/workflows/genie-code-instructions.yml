name: genie-code-instructions

# Checks the instruction files on every pull request. After a merge to main it
# deploys them DEV -> TEST -> PROD, and PROD waits for approval from the
# required reviewers set on the "prod" GitHub environment.
#
# It can also be started by hand from the Actions tab (Run workflow). Pick the
# environment and only that environment is deployed. DEV and TEST can run from
# any branch, which is useful before a merge. PROD can only run from main.

on:
  pull_request:
    paths:
      - "databricks/genie-code-instructions/**"
      - ".github/workflows/genie-code-instructions.yml"
  push:
    branches: [main]
    paths:
      - "databricks/genie-code-instructions/**"
      - ".github/workflows/genie-code-instructions.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - test
          - prod

permissions:
  contents: read

# One deployment at a time, so an older run cannot overwrite a newer one.
concurrency:
  group: genie-code-instructions-deploy
  cancel-in-progress: false

env:
  FEATURE_DIR: databricks/genie-code-instructions
  CLI_VERSION: 1.24.0

# The setup-cli action is pinned to the commit of its v1.24.0 tag, and the
# access token is only passed to the deploy step, so the setup action never
# sees it.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check instruction file length
        run: python "$FEATURE_DIR/scripts/check_length.py"

  deploy-dev:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    needs: check
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@483500c487a296b26b5875a07decbd6e7b1b58c5 # v1.24.0
        with:
          version: ${{ env.CLI_VERSION }}
      - name: Deploy dev.md to DEV
        env:
          DATABRICKS_AUTH_TYPE: pat
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: bash "$FEATURE_DIR/scripts/deploy.sh" "$FEATURE_DIR/instructions/dev.md"

  deploy-test:
    # always() lets this job run when DEV was skipped on a manual run.
    if: >-
      always() && needs.check.result == 'success' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy-dev.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'test')
      )
    needs: [check, deploy-dev]
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@483500c487a296b26b5875a07decbd6e7b1b58c5 # v1.24.0
        with:
          version: ${{ env.CLI_VERSION }}
      - name: Deploy test.md to TEST
        env:
          DATABRICKS_AUTH_TYPE: pat
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: bash "$FEATURE_DIR/scripts/deploy.sh" "$FEATURE_DIR/instructions/test.md"

  deploy-prod:
    # PROD only ever deploys from main, whether it runs after TEST or by hand.
    if: >-
      always() && needs.check.result == 'success' && github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && needs.deploy-test.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
      )
    needs: [check, deploy-test]
    runs-on: ubuntu-latest
    # Required reviewers on this environment hold the job until someone approves.
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@483500c487a296b26b5875a07decbd6e7b1b58c5 # v1.24.0
        with:
          version: ${{ env.CLI_VERSION }}
      - name: Deploy prod.md to PROD
        env:
          DATABRICKS_AUTH_TYPE: pat
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: bash "$FEATURE_DIR/scripts/deploy.sh" "$FEATURE_DIR/instructions/prod.md"
